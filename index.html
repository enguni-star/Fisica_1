                { id: 20, type: 'quiz', title: '20. EXAME FINAL', icon: 'fa-trophy', theme: 'slate' }
            ],

            lessonsContent: {
                1: `<p>A <strong>Energia</strong> é a capacidade de realizar trabalho.</p>
                    <div class="bg-sky-50 border-2 border-sky-200 p-4 rounded-xl mt-4">
                        <p>🔹 <strong>Lei de Conservação:</strong> A energia não pode ser criada nem destruída. Ela pode ser única e exclusivamente transformada de uma modalidade em outra.</p>
                    </div>` /*[cite: 80] */,
                
                2: `<p>O <strong>Trabalho ($\\tau$)</strong> de uma força constante, paralela ao movimento, é o produto da força pelo deslocamento.</p>
                    <ul class="list-disc ml-6 mt-4 space-y-2 text-indigo-700 font-semibold">
                        <li><strong>Fórmula Base:</strong> $\\tau = F \\cdot d$</li>
                        <li><strong>Unidade no SI:</strong> Joule ($J$), que equivale a Newton $\\times$ metro ($N \\cdot m$).</li>
                    </ul>` /*[cite: 81] */,
                
                3: `<p>O sinal do trabalho indica se a força ajuda ou atrapalha o movimento.</p>
                    <div class="bg-purple-50 p-4 rounded-xl border-2 border-purple-200 mt-4 mb-4">
                        <p>🟢 <strong>Trabalho Motor ($\\tau > 0$):</strong> A força favorece o deslocamento (Ex: Peso na queda livre).</p>
                        <p>🔴 <strong>Trabalho Resistente ($\\tau < 0$):</strong> A força se opõe ao deslocamento (Ex: Peso ao jogar objeto pra cima).</p>
                    </div>` /*[cite: 82] */,
                
                5: `<p>Quando a força não é paralela, precisamos decompor usando o ângulo $\\theta$.</p>
                    <p class="mt-4 bg-sky-100 p-3 rounded-lg border-2 border-sky-300">Apenas a componente que empurra na direção do movimento realiza trabalho. A fórmula geral vira: <strong>$\\tau = F \\cdot d \\cdot \\cos(\\theta)$</strong>.</p>` /*[cite: 84] */,
                
                6: `<p>O <strong>Trabalho Nulo</strong> ocorre quando a força é perpendicular ($90^\\circ$) ao deslocamento.</p>
                    <div class="bg-indigo-50 border-2 border-indigo-200 p-4 rounded-xl mt-4">
                        <p>Como $\\cos(90^\\circ) = 0$, o trabalho é zero ($\\tau = 0$).</p>
                        <p class="mt-2"><strong>Exemplos Clássicos:</strong> Força Normal em superfície horizontal e Força Centrípeta no MCU.</p>
                    </div>` /*[cite: 85] */,
                
                8: `<p>Se a força for <strong>variável</strong>, não podemos usar a fórmula direta.</p>
                    <ul class="list-disc ml-6 mt-4 space-y-2 text-emerald-700 font-semibold">
                        <li><strong>Método Gráfico:</strong> O trabalho é numericamente igual à <strong>área sob o gráfico</strong> da Força x Deslocamento ($F \\times d$).</li>
                    </ul>` /*[cite: 86] */,
                
                9: `<p>O <strong>Trabalho do Peso</strong> depende apenas do desnível vertical (altura $h$).</p>
                    <div class="bg-emerald-50 border-2 border-emerald-300 p-4 rounded-xl mt-4 text-emerald-800">
                        <p><strong>Fórmula:</strong> $\\tau = \\pm P \\cdot h$</p>
                        <p class="mt-2"><strong>Regra de Ouro:</strong> O trabalho do peso <strong>independe da trajetória</strong>. Reta, curva ou escada: se a altura é a mesma, o trabalho é o mesmo!</p>
                    </div>` /*[cite: 87, 88] */,

                10: `<p>A <strong>Força Elástica</strong> em uma mola é variável (Lei de Hooke: $F = k \\cdot x$).</p>
                     <p class="mt-4">Como o gráfico de $F \\times x$ é um triângulo, a área (Trabalho) fica:</p>
                     <p class="bg-emerald-100 p-3 rounded border-2 border-emerald-200 text-center font-bold">$\\tau_{el} = \\pm \\frac{k \\cdot x^2}{2}$</p>` /*[cite: 89, 90] */,

                12: `<p>Na Física, forças são classificadas pelo comportamento do seu trabalho.</p>
                     <div class="bg-teal-50 border-2 border-teal-200 p-4 rounded-xl mt-4">
                         <p><strong>Forças Conservativas:</strong> O trabalho independe da trajetória, depende apenas do início e fim.</p>
                         <p><strong>Exemplos:</strong> Força Peso e Força Elástica.</p>
                     </div>` /*[cite: 91] */,

                13: `<p>As <strong>Forças Dissipativas</strong> dependem do caminho percorrido.</p>
                     <p class="mt-4 bg-rose-50 p-3 rounded border-2 border-rose-200">Elas transformam energia mecânica em calor (energia térmica). O maior exemplo é a <strong>Força de Atrito</strong>, cujo trabalho é sempre resistente (negativo) pois se opõe ao escorregamento.</p>` /*[cite: 92] */,

                14: `<p>A <strong>Potência ($P$)</strong> mede a rapidez (ritmo) com que um trabalho é realizado.</p>
                     <ul class="bg-teal-50 p-4 rounded-xl border-2 border-teal-200 mt-4 space-y-2 text-teal-800 text-sm">
                         <li><strong>Fórmula:</strong> $P = \\frac{\\tau}{\\Delta t}$</li>
                         <li>Máquinas mais potentes realizam o mesmo trabalho em menos tempo.</li>
                     </ul>` /*[cite: 93] */,

                16: `<p>Unidades de Potência:</p>
                     <div class="bg-sky-50 border-2 border-sky-200 p-4 rounded-xl mt-4 text-sky-800">
                         <p>🔹 <strong>No SI:</strong> Watt ($W$), que é Joule por segundo ($J/s$).</p>
                         <p>🔹 <strong>Práticas:</strong> Horse Power ($1~HP \\approx 746~W$) e Cavalo-vapor ($1~cv \\approx 735~W$).</p>
                     </div>` /*[cite: 94] */,

                17: `<p>Se a força for constante e na mesma direção do movimento, podemos usar a <strong>Potência Instantânea</strong>.</p>
                     <ul class="list-disc ml-6 mt-4 font-bold text-indigo-700">
                         <li>Substituindo $\\tau$ por $F \\cdot d$, chegamos a: $P = F \\cdot v$.</li>
                         <li>A Potência é a Força multiplicada pela velocidade ($v$).</li>
                     </ul>` /*[cite: 95] */,
                     
                18: `<p>O <strong>Rendimento ($\\eta$)</strong> indica a eficiência de uma máquina.</p>
                     <div class="bg-purple-50 border-2 border-purple-200 p-4 rounded-xl mt-4">
                         <p><strong>Fórmula:</strong> $\\eta = \\frac{P_u}{P_t}$ (Útil dividida pela Total).</p>
                         <p>O rendimento é sempre um número entre 0 e 1 (ou $0\\%$ a $100\\%$).</p>
                     </div>` /*[cite: 96] */,
                     
                19: `<p>Nenhuma máquina é perfeita. A energia total fornecida sempre se divide:</p>
                     <p class="mt-4 text-center font-bold text-lg text-purple-700">Potência Total = Pot. Útil + Pot. Dissipada</p>
                     <p class="mt-2 text-sm">A parte dissipada geralmente vira calor ou som.</p>` /*[cite: 96] */
            },

            hints: {

                    { q: "A Lei de Conservação da Energia afirma que a energia:", o: ["Pode ser criada por reatores", "É destruída pelo atrito", "Some no vácuo", "Não pode ser criada nem destruída, apenas transformada"], c: 3, d: 1, h: "A quantidade total de energia no universo é sempre constante." /*[cite: 80] */ },
                    { q: "A unidade de Trabalho no Sistema Internacional (SI) é o:", o: ["Newton (N)", "Joule (J)", "Watt (W)", "Kelvin (K)"], c: 1, d: 1, h: "Essa unidade equivale a Newton x metro ($N \\cdot m$)." /*[cite: 81] */ },
                    { q: "A fórmula básica para calcular o trabalho ($\\tau$) de uma força paralela ao movimento é:", o: ["$\\tau = F + d$", "$\\tau = F / d$", "$\\tau = F \\cdot d$", "$\\tau = m \\cdot g$"], c: 2, d: 1, h: "É a força aplicada multiplicada pelo quanto o objeto andou." /*[cite: 81] */ },
                    { q: "Quando a força atua no MESMO sentido do deslocamento (ajudando o movimento), o trabalho é chamado de:", o: ["Resistente e negativo", "Nulo", "Motor e positivo", "Dissipativo"], c: 2, d: 2, h: "Pense em um 'motor' que empurra o carro para frente." /*[cite: 82] */ },

                const iconColor = isUnlocked ? theme.text : 'text-slate-400';

                const titleColor = isUnlocked ? 'text-slate-800' : 'text-slate-400';

                let checkBadge = '';
                if(isUnlocked && lvl.id < unlockedLevels) {
                    checkBadge = `<div class="absolute -top-3 -right-3 bg-emerald-400 text-white w-8 h-8 rounded-full border-2 border-emerald-600 flex items-center justify-center font-bold shadow-md z-10"><i class="fa-solid fa-check"></i></div>`;

                grid.innerHTML += `
                    <div onclick="openLevel(${lvl.id}, ${isUnlocked})" class="level-card cartoon-shadow rounded-2xl p-4 flex flex-col items-center justify-center text-center h-32 md:h-40 ${stateClass} border-2 ${borderColor} relative">

        function updateProgress() {
            const total = COURSE_DATA.levelsInfo.length;
            const percent = Math.floor(((unlockedLevels - 1) / total) * 100);
            document.getElementById('progress-text').innerText = `${percent}%`;
        }

        function showScreen(screenId) {
            ['map-screen', 'lesson-screen', 'quiz-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleHint() {
            const hintBox = document.getElementById('lesson-hint');
            if (hintBox.style.display === 'block') {
                hintBox.style.display = 'none';
            } else {
                hintBox.style.display = 'block';
            }
        }

        window.toggleQuizHint = function(index) {
            const hintDiv = document.getElementById(`hint-q${index}`);
            if (hintDiv.classList.contains('hidden')) {
                hintDiv.classList.remove('hidden');
            } else {
                hintDiv.classList.add('hidden');
            }
        };

        function openLevel(id, isUnlocked) {
            if (!isUnlocked) return;
            currentActiveLevel = id;
            const levelObj = COURSE_DATA.levelsInfo.find(l => l.id === id);

            if (levelObj.type === 'lesson' || levelObj.type === 'lab') {
                document.getElementById('lesson-title').innerText = levelObj.title;
                const content = COURSE_DATA.lessonsContent[id] || `<p class="text-center font-bold text-slate-400">Conteúdo não preenchido.</p>`;
                document.getElementById('lesson-content').innerHTML = content;
                
                const hintButton = document.getElementById('hint-button');
                const hintBox = document.getElementById('lesson-hint');
                hintBox.style.display = 'none'; 
                
                if (COURSE_DATA.hints[id]) {
                    hintBox.innerText = `💡 Dica Rápida: ${COURSE_DATA.hints[id]}`;
                    hintButton.classList.remove('hidden');
                } else {
                    hintButton.classList.add('hidden');
                }

                showScreen('lesson-screen');
                renderMathSafe();
                
            } else if (levelObj.type === 'quiz') {
                document.getElementById('quiz-title').innerText = levelObj.title;
                buildQuiz(id);
                showScreen('quiz-screen');
                renderMathSafe();
            }
        }

        function completeLesson() {
            if (currentActiveLevel === unlockedLevels) {
                unlockedLevels++;
                renderMap();
                updateProgress();
            }
            showScreen('map-screen');
        }

                container.innerHTML += `
                    <div class="bg-white p-6 md:p-8 rounded-3xl border-2 border-slate-200 shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-2 h-full bg-amber-400"></div>
                        <div class="mb-5 pl-2">
                            ${difTag}
                            <p class="font-bold text-xl text-slate-800 pr-20">${qIndex + 1}. ${qObj.q}</p>
                        </div>
                        <div class="space-y-3">
                            ${optionsHTML}
                        </div>
                        ${hintHTML}
                    </div>
                `;
            });
        }

        function selectAnswer(qIndex, oIndex) {
            currentQuizAnswers[qIndex] = oIndex;
        }

        function submitQuiz() {
            if (currentQuizAnswers.includes(null)) {
                const faltando = currentQuizAnswers.filter(ans => ans === null).length;
                alert(`Faltam responder ${faltando} pergunta(s) antes de entregar.`);
                return;
            }

            const questions = COURSE_DATA.quizzesData[currentActiveLevel];
            let score = 0;
            currentQuizAnswers.forEach((ans, idx) => {
                if (ans === questions[idx].c) score++;
            });

            const total = questions.length;
            const percentage = Math.round((score / total) * 100);
            const passTarget = Math.ceil(total * COURSE_DATA.config.passMark);
            const passed = score >= passTarget;

            showResultModal(passed, score, total, percentage, passTarget);
        }

        function showResultModal(passed, score, total, pct, passTarget) {
            const modal = document.getElementById('result-modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const scoreTxt = document.getElementById('modal-score');
            const msg = document.getElementById('modal-msg');
            const content = document.getElementById('modal-content');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            scoreTxt.innerText = `${score} de ${total}`;

            if (passed) {
                icon.innerHTML = '<i class="fa-solid fa-trophy text-amber-400"></i>';
                title.innerText = "Aprovado com Sucesso!";
                title.className = "text-3xl font-black mb-2 text-emerald-600 uppercase tracking-wide";
                scoreTxt.className = "text-5xl font-black text-emerald-600 drop-shadow-sm";
                msg.innerHTML = `Fantástico! A sua pontuação foi de <strong>${pct}%</strong>. Você liberou o próximo módulo no mapa principal!`;
                
                if (currentActiveLevel === unlockedLevels) {
                    unlockedLevels++;
                    renderMap();
                    updateProgress();
                }
            } else {
                icon.innerHTML = '<i class="fa-solid fa-face-sad-tear text-rose-400"></i>';
                title.innerText = "Quase lá...";
                title.className = "text-3xl font-black mb-2 text-rose-500 uppercase tracking-wide";
                scoreTxt.className = "text-5xl font-black text-rose-600 drop-shadow-sm";
                const goal = (passTarget/total)*100;
                msg.innerHTML = `Sua pontuação foi de <strong>${pct}%</strong>. Lembre-se que a meta de aprovação é <strong>${goal}%</strong>. Volte à teoria e tente de novo!`;
            }
        }

        function closeModal() {
            const modal = document.getElementById('result-modal');
            const content = document.getElementById('modal-content');
            
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                showScreen('map-screen');
            }, 200);
        }

        document.addEventListener("DOMContentLoaded", initEngine);
        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(initEngine, 1);
        }
    </script>
</body>
</html>
